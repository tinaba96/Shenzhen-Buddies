<!doctype html><html><head><meta charset="utf-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1080px; height:1920px; background:transparent; overflow:hidden; }
body { font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif; color:#f6f4ef; }
.scrim-top { position:absolute; left:0; right:0; top:0; height:900px; background:linear-gradient(180deg,rgba(15,21,18,.74) 0%,rgba(15,21,18,.58) 45%,rgba(15,21,18,0) 100%); }
.scrim-bot { position:absolute; left:0; right:0; bottom:0; height:900px; background:linear-gradient(0deg,rgba(15,21,18,.80) 0%,rgba(15,21,18,.6) 45%,rgba(15,21,18,0) 100%); }
.top { position:absolute; left:72px; right:72px; top:300px; }
.bot { position:absolute; left:72px; right:72px; bottom:300px; }
.kicker { display:inline-flex; align-items:center; gap:14px; font-size:28px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
  padding:14px 26px; border-radius:999px; background:rgba(15,21,18,.62); border:1px solid rgba(246,244,239,.35); margin-bottom:28px; }
.dot { width:12px; height:12px; border-radius:50%; background:#e0664c; box-shadow:0 0 16px #e0664c; }
h1 { font-family:Georgia,"Times New Roman",serif; font-weight:400; font-size:112px; line-height:1.02; letter-spacing:-.02em;
  text-shadow:0 4px 30px rgba(15,21,18,.85), 0 0 6px rgba(15,21,18,.7); }
h1.xl { font-size:132px; }
h1 em { font-style:italic; color:#f6a58f; }
.sub { margin-top:22px; font-size:38px; line-height:1.3; color:rgba(246,244,239,.9); text-shadow:0 2px 14px rgba(15,21,18,.9); }
.center { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; }
.endwrap { padding:0 80px; }
.lead { font-family:Georgia,serif; font-size:92px; line-height:1.06; text-shadow:0 4px 30px rgba(0,0,0,.8); }
.lead em { font-style:italic; color:#f6a58f; }
.brand { margin-top:64px; font-family:Georgia,serif; font-size:64px; }
.tag { margin-top:14px; font-size:30px; letter-spacing:.14em; text-transform:uppercase; color:rgba(246,244,239,.75); }
.cta { display:inline-block; margin-top:52px; font-size:44px; font-weight:700; padding:24px 44px; border-radius:999px; background:#0d8f6f; box-shadow:0 12px 40px rgba(13,143,111,.55); }
</style></head><body><div class="scrim-top"></div><div class="top"><h1>Lunch break.<br>Wireless charging<br><em>in the table</em></h1></div></body></html>
