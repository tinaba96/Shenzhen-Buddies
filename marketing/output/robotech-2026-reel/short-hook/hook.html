<!doctype html><html><head><meta charset="utf-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1080px; height:1920px; background:transparent; overflow:hidden; }
body { font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif; color:#f6f4ef; }
.scrim { position:absolute; left:0; right:0; bottom:0; height:1000px; background:linear-gradient(0deg,rgba(15,21,18,.86) 0%,rgba(15,21,18,.62) 45%,rgba(15,21,18,0) 100%); }
.mid { position:absolute; left:64px; right:64px; bottom:520px; }
.kicker { display:inline-flex; align-items:center; gap:14px; font-size:30px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
  padding:14px 26px; border-radius:999px; background:rgba(15,21,18,.7); border:1px solid rgba(246,244,239,.4); margin-bottom:26px; }
.dot { width:12px; height:12px; border-radius:50%; background:#e0664c; box-shadow:0 0 16px #e0664c; }
h1 { font-family:Georgia,"Times New Roman",serif; font-weight:400; font-size:136px; line-height:1.0; letter-spacing:-.02em;
  text-shadow:0 6px 36px rgba(15,21,18,.9), 0 0 8px rgba(15,21,18,.8); }
h1 em { font-style:italic; color:#f6a58f; }
.sub { margin-top:24px; font-size:42px; line-height:1.3; color:rgba(246,244,239,.92); text-shadow:0 2px 14px rgba(15,21,18,.9); }
.center { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; }
.endwrap { padding:0 70px; }
.lead { font-family:Georgia,serif; font-size:100px; line-height:1.05; text-shadow:0 4px 30px rgba(0,0,0,.8); }
.lead em { font-style:italic; color:#f6a58f; }
.q { margin-top:48px; font-size:46px; line-height:1.3; color:rgba(246,244,239,.92); }
.brand { margin-top:60px; font-family:Georgia,serif; font-size:60px; }
.tag { margin-top:12px; font-size:28px; letter-spacing:.14em; text-transform:uppercase; color:rgba(246,244,239,.72); }
.cta { display:inline-block; margin-top:44px; font-size:42px; font-weight:700; padding:22px 42px; border-radius:999px; background:#0d8f6f; box-shadow:0 12px 40px rgba(13,143,111,.55); }
</style></head><body><div class="scrim"></div><div class="mid"><div class="kicker"><span class="dot"></span>Shenzhen, China</div><h1>A normal<br><em>weekday</em> here.</h1></div></body></html>
